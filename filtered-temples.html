<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temple Album - Filtered</title>

    <meta name="description" content="A Temple Album page displaying temples from around the world with filtering capabilities.">
    <meta name="author" content="Adriko Cyrus">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles/filtered-temples.css">
    <link rel="stylesheet" href="styles/filtered-temples-large.css">

    <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>
    <header>
        <div class="TempleAlbum">
            <span>🏛️ Temple Album</span>
        </div>
        
        <button id="menuButton" aria-label="Open Menu">
            ☰
        </button>
        
        <nav id="navigation">
            <a href="#" data-filter="home">Home</a>
            <a href="#" data-filter="old">Old</a>
            <a href="#" data-filter="new">New</a>
            <a href="#" data-filter="large">Large</a>
            <a href="#" data-filter="small">Small</a>
        </nav>
    </header>
    
    <main>
        <h1>Temples</h1>
        
        <div class="temple-grid" id="templeGrid">
            <!-- Temples will be dynamically generated here -->
        </div>
    </main>
    
    <footer>
        <p>
            &copy; <span id="currentyear"></span> Adriko Cyrus | Uganda
        </p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
