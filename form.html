<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form - Share your experience with products and help others make informed decisions. Rate products and provide feedback.">
    <meta name="author" content="Adriko Cyrus">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form id="reviewForm" action="review.html" method="get">
            <!-- Product Name -->
            <div class="form-group">
                <label for="productName">Product Name <span class="required">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <!-- Overall Rating -->
            <div class="form-group">
                <label>Overall Rating <span class="required">*</span></label>
                <div class="rating-container" id="ratingContainer">
                    <label class="rating-option" for="rating1">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <span class="star">☆</span>
                    </label>
                    <label class="rating-option" for="rating2">
                        <input type="radio" id="rating2" name="rating" value="2" required>
                        <span class="star">☆</span>
                    </label>
                    <label class="rating-option" for="rating3">
                        <input type="radio" id="rating3" name="rating" value="3" required>
                        <span class="star">☆</span>
                    </label>
                    <label class="rating-option" for="rating4">
                        <input type="radio" id="rating4" name="rating" value="4" required>
                        <span class="star">☆</span>
                    </label>
                    <label class="rating-option" for="rating5">
                        <input type="radio" id="rating5" name="rating" value="5" required>
                        <span class="star">☆</span>
                    </label>
                </div>
            </div>

            <!-- Date of Installation -->
            <div class="form-group">
                <label for="installDate">Date of Installation <span class="required">*</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <!-- Useful Features -->
            <div class="form-group">
                <label>Useful Features</label>
                <div class="checkbox-group">
                    <label class="checkbox-option" for="feature1">
                        <input type="checkbox" id="feature1" name="features" value="ease-of-use">
                        Ease of Use
                    </label>
                    <label class="checkbox-option" for="feature2">
                        <input type="checkbox" id="feature2" name="features" value="performance">
                        Performance
                    </label>
                    <label class="checkbox-option" for="feature3">
                        <input type="checkbox" id="feature3" name="features" value="durability">
                        Durability
                    </label>
                    <label class="checkbox-option" for="feature4">
                        <input type="checkbox" id="feature4" name="features" value="design">
                        Design
                    </label>
                    <label class="checkbox-option" for="feature5">
                        <input type="checkbox" id="feature5" name="features" value="value">
                        Value for Money
                    </label>
                </div>
            </div>

            <!-- Written Review -->
            <div class="form-group">
                <label for="writtenReview">Written Review</label>
                <textarea id="writtenReview" name="writtenReview" rows="5" placeholder="Share your experience with this product..."></textarea>
            </div>

            <!-- User Name -->
            <div class="form-group">
                <label for="userName">User Name</label>
                <input type="text" id="userName" name="userName" placeholder="Enter your name (optional)">
            </div>

            <!-- Submit Button -->
            <div class="form-group">
                <input type="submit" value="Submit Review" class="submit-btn">
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026, Adriko Cyrus</p>
        <p>Uganda - Kampala</p>
    </footer>

</body>
</html>
