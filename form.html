<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form id="reviewForm" action="review.html" method="get">
            <!-- Product Name -->
            <div class="form-group">
                <label for="productName">Product Name <span class="required">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <!-- Overall Rating -->
            <div class="form-group">
                <label>Overall Rating <span class="required">*</span></label>
                <div class="rating-container" id="ratingContainer">
                    <label class="rating-option">
                        <input type="radio" name="rating" value="1" required>
                        <span class="star">☆</span>
                    </label>
                    <label class="rating-option">
                        <input type="radio" name="rating" value="2" required>
                        <span class="star">☆</span>
                    </label>
                    <label class="rating-option">
                        <input type="radio" name="rating" value="3" required>
                        <span class="star">☆</span>
                    </label>
                    <label class="rating-option">
                        <input type="radio" name="rating" value="4" required>
                        <span class="star">☆</span>
                    </label>
                    <label class="rating-option">
                        <input type="radio" name="rating" value="5" required>
                        <span class="star">☆</span>
                    </label>
                </div>
            </div>

            <!-- Date of Installation -->
            <div class="form-group">
                <label for="installDate">Date of Installation <span class="required">*</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <!-- Useful Features -->
            <div class="form-group">
                <label>Useful Features</label>
                <div class="checkbox-group">
                    <label class="checkbox-option">
                        <input type="checkbox" name="features" value="ease-of-use">
                        Ease of Use
                    </label>
                    <label class="checkbox-option">
                        <input type="checkbox" name="features" value="performance">
                        Performance
                    </label>
                    <label class="checkbox-option">
                        <input type="checkbox" name="features" value="durability">
                        Durability
                    </label>
                    <label class="checkbox-option">
                        <input type="checkbox" name="features" value="design">
                        Design
                    </label>
                    <label class="checkbox-option">
                        <input type="checkbox" name="features" value="value">
                        Value for Money
                    </label>
                </div>
            </div>

            <!-- Written Review -->
            <div class="form-group">
                <label for="writtenReview">Written Review</label>
                <textarea id="writtenReview" name="writtenReview" rows="5" placeholder="Share your experience with this product..."></textarea>
            </div>

            <!-- User Name -->
            <div class="form-group">
                <label for="userName">User Name</label>
                <input type="text" id="userName" name="userName" placeholder="Enter your name (optional)">
            </div>

            <!-- Submit Button -->
            <div class="form-group">
                <input type="submit" value="Submit Review" class="submit-btn">
            </div>
        </form>
    </main>

    <footer>
        <p>&copy;2026, Adriko Cyrus</p>
        <p><Uganda-kampala</p>
    </footer>

    <script src="scripts/form.js"></script>
</body>
</html>
