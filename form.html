<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Product Review Form - Submit your product review">
    <meta name="author" content="Adriko Cyrus">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>
    <main>
        <form id="reviewForm" action="review.html" method="get">
            <div class="form-group">
                <label for="productName">Product Name <span aria-hidden="true">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" selected disabled>Select a Product...</option>
                </select>
            </div>

            <div class="form-group">
                <fieldset class="rating-group">
                    <legend>Overall Rating <span aria-hidden="true">*</span></legend>
                    <div class="rating-container">
                        <label for="rating1">
                            <input type="radio" id="rating1" name="rating" value="1" required>
                            <span class="star">★</span>
                        </label>
                        <label for="rating2">
                            <input type="radio" id="rating2" name="rating" value="2" required>
                            <span class="star">★★</span>
                        </label>
                        <label for="rating3">
                            <input type="radio" id="rating3" name="rating" value="3" required>
                            <span class="star">★★★</span>
                        </label>
                        <label for="rating4">
                            <input type="radio" id="rating4" name="rating" value="4" required>
                            <span class="star">★★★★</span>
                        </label>
                        <label for="rating5">
                            <input type="radio" id="rating5" name="rating" value="5" required>
                            <span class="star">★★★★★</span>
                        </label>
                    </div>
                </fieldset>
            </div>

            <div class="form-group">
                <label for="installDate">Date of Installation <span aria-hidden="true">*</span></label>
                <input id="installDate" name="installDate" type="date" required>
            </div>

            <div class="form-group">
                <label for="writtenReview">Written Review</label>
                <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="userName">User Name</label>
                <input id="userName" name="userName" type="text">
            </div>

            <button type="submit" class="submit-btn">Submit Review</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Adriko Cyrus</p>
    </footer>
</body>
</html>
